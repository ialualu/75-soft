<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>75 Soft Challenge Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0c0d0e;
      color: #ffffff;
      padding: 30px 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 400;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    /* Status Legend */
    .legend {
      display: flex;
      gap: 25px;
      align-items: center;
      margin-bottom: 30px;
      font-size: 0.9rem;
      color: #d1d5db;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-box {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }

    .bg-completed { background-color: #3b82f6; }
    .bg-partial { background-color: #86efac; }
    .bg-current { background-color: #f59e0b; }
    .bg-empty { background-color: #fca5a5; }

    /* 75-Day Grid (D1 to D75 top-left to bottom-right) */
    .grid-75 {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 6px;
      margin-bottom: 40px;
    }

    .grid-node {
      aspect-ratio: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #0c0d0e;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
    }

    .grid-node:hover {
      transform: scale(1.08);
    }

    /* Table Schedule & Meal Plan */
    .table-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .table-container {
      margin-bottom: 30px;
      border-bottom: 1px solid #1f2937;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      padding: 12px 10px;
      border-bottom: 1px solid #374151;
    }

    td {
      padding: 10px;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    tr:nth-child(even) td {
      background-color: #111315;
    }

    /* Editable Table Cells & Inputs */
    .editable-cell {
      outline: none;
      border-radius: 4px;
      padding: 4px 6px;
      transition: background 0.2s;
    }

    .editable-cell:focus {
      background-color: #1f2937;
      color: #38bdf8;
    }

    .meal-input {
      width: 100%;
      background: #17191c;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px 10px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }

    .meal-input:focus {
      border-color: #3b82f6;
    }

    .btn-row-action {
      background: #1f2937;
      color: #9ca3af;
      border: 1px solid #374151;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-row-action:hover {
      color: #ffffff;
      border-color: #4b5563;
    }

    .btn-delete-row {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* Progress & Streak Banner */
    .stats-banner {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      margin-bottom: 40px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: #9ca3af;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-divider {
      width: 1px;
      height: 30px;
      background-color: #374151;
    }

    /* Controls Section */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 40px;
      align-items: center;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
    }

    .control-label {
      font-size: 1.05rem;
      color: #ffffff;
    }

    /* Number Stepper */
    .stepper {
      display: flex;
      align-items: center;
      background-color: #17191c;
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
      max-width: 300px;
    }

    .stepper-btn {
      background: #17191c;
      color: #9ca3af;
      border: none;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
    }

    .stepper-btn:hover {
      color: #ffffff;
    }

    .stepper-val {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      background: transparent;
      border: none;
      color: #ffffff;
    }

    /* Water Input Display */
    .water-input-box {
      background-color: #17191c;
      border-radius: 8px;
      width: 100px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    /* Toggle Switches */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .2s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #3b82f6;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }
  </style>
</head>
<body>

  <h1>75 Soft Challenge Dashboard</h1>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-box bg-completed"></div> Completed</div>
    <div class="legend-item"><div class="legend-box bg-partial"></div> Partial</div>
    <div class="legend-item"><div class="legend-box bg-current"></div> Current</div>
    <div class="legend-item"><div class="legend-box bg-empty"></div> Empty</div>
  </div>

  <!-- 75-Day Grid (Top-Left D1 to Bottom-Right D75) -->
  <div id="grid-container" class="grid-75"></div>

  <!-- Editable Schedule & Meal Plan Table -->
  <div class="table-header-row">
    <span style="font-size: 0.9rem; color: #9ca3af;">Click on time or schedule text to edit directly</span>
    <button class="btn-row-action" onclick="addScheduleRow()">+ Add Row</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 20%;">Time Slot</th>
          <th style="width: 40%;">Activity Schedule</th>
          <th style="width: 35%;">Meal Plan</th>
          <th style="width: 5%;"></th>
        </tr>
      </thead>
      <tbody id="schedule-tbody">
        <!-- Rows dynamically rendered via JS -->
      </tbody>
    </table>
  </div>

  <!-- Progress & Streak -->
  <div class="stats-banner">
    <div class="stat-box">
      <div class="stat-label">PROGRESS</div>
      <div id="val-progress" class="stat-value">0%</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-box">
      <div class="stat-label">STREAK</div>
      <div id="val-streak" class="stat-value">0 Days</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-grid">
    
    <!-- Current Day Controller -->
    <div class="control-row" style="grid-column: span 2;">
      <span class="control-label">Current Day</span>
      <div class="stepper">
        <button class="stepper-btn" onclick="adjustDay(-1)">remove</button>
        <div id="current-day-num" class="stepper-val">1</div>
        <button class="stepper-btn" onclick="adjustDay(1)">add</button>
      </div>
    </div>

    <!-- Water Track -->
    <div class="control-row">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="control-label">Water (L)</span>
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #3b82f6;"></div>
      </div>
      <div class="water-input-box" id="water-display" onclick="addWater()">0</div>
    </div>

    <!-- Workout 45m -->
    <div class="control-row">
      <span class="control-label">Workout 45m</span>
      <label class="switch">
        <input type="checkbox" id="chk-workout" onchange="updateData()">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Eat Well -->
    <div class="control-row">
      <span class="control-label">Eat Well</span>
      <label class="switch">
        <input type="checkbox" id="chk-eatwell" onchange="updateData()">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Read 10pgs -->
    <div class="control-row">
      <span class="control-label">Read 10pgs</span>
      <label class="switch">
        <input type="checkbox" id="chk-reading" onchange="updateData()">
        <span class="slider"></span>
      </label>
    </div>

  </div>

  <script>
    let activeDay = 1;
    let db = JSON.parse(localStorage.getItem('75SoftUIEditable')) || {};

    // Default table rows if day is new
    const defaultSchedule = [
      { time: '06:00 AM', activity: 'Morning Routine & Water', meal: 'Breakfast: Oatmeal & Fruit' },
      { time: '08:00 AM', activity: '45m Workout Session', meal: '' },
      { time: '12:00 PM', activity: 'Focused Work / Study', meal: 'Lunch: Chicken Salad & Rice' },
      { time: '03:00 PM', activity: 'Reading 10 Pages', meal: 'Snack: Handful of Almonds' },
      { time: '07:00 PM', activity: 'Evening Reflection & Hydration Check', meal: 'Dinner: Grilled Salmon & Veggies' },
      { time: '10:00 PM', activity: 'Wind Down / Bedtime', meal: '' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      renderGrid();
      loadDayData(activeDay);
    });

    // Render Grid D1 to D75 (Top-Left to Bottom-Right)
    function renderGrid() {
      const grid = document.getElementById('grid-container');
      grid.innerHTML = '';

      for (let d = 1; d <= 75; d++) {
        const node = document.createElement('div');
        node.className = 'grid-node ' + getNodeColorClass(d);
        node.innerText = `D${d}`;
        node.onclick = () => {
          activeDay = d;
          loadDayData(activeDay);
        };
        grid.appendChild(node);
      }
    }

    function getNodeColorClass(d) {
      if (d === activeDay) return 'bg-current';
      const dayInfo = db[d];
      if (!dayInfo) return 'bg-empty';

      const completedCount = (dayInfo.workout ? 1 : 0) + (dayInfo.eatwell ? 1 : 0) + (dayInfo.reading ? 1 : 0) + (dayInfo.water >= 3 ? 1 : 0);

      if (completedCount === 4) return 'bg-completed';
      if (completedCount > 0) return 'bg-partial';
      return 'bg-empty';
    }

    function loadDayData(day) {
      activeDay = day;
      document.getElementById('current-day-num').innerText = activeDay;

      const data = db[activeDay] || { 
        workout: false, 
        eatwell: false, 
        reading: false, 
        water: 0,
        schedule: JSON.parse(JSON.stringify(defaultSchedule))
      };

      document.getElementById('chk-workout').checked = !!data.workout;
      document.getElementById('chk-eatwell').checked = !!data.eatwell;
      document.getElementById('chk-reading').checked = !!data.reading;
      document.getElementById('water-display').innerText = data.water || 0;

      renderTableRows(data.schedule || defaultSchedule);
      renderGrid();
      calcMetrics();
    }

    function renderTableRows(scheduleList) {
      const tbody = document.getElementById('schedule-tbody');
      tbody.innerHTML = '';

      scheduleList.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><div class="editable-cell" contenteditable="true" onblur="saveTableRow(${idx}, 'time', this.innerText)">${row.time}</div></td>
          <td><div class="editable-cell" contenteditable="true" onblur="saveTableRow(${idx}, 'activity', this.innerText)">${row.activity}</div></td>
          <td><input type="text" class="meal-input" value="${row.meal || ''}" placeholder="Type meal..." oninput="saveTableRow(${idx}, 'meal', this.value)"></td>
          <td><button class="btn-delete-row" onclick="deleteScheduleRow(${idx})">&times;</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function saveTableRow(index, field, value) {
      if (!db[activeDay]) {
        db[activeDay] = { workout: false, eatwell: false, reading: false, water: 0, schedule: JSON.parse(JSON.stringify(defaultSchedule)) };
      }
      if (!db[activeDay].schedule) {
        db[activeDay].schedule = JSON.parse(JSON.stringify(defaultSchedule));
      }

      db[activeDay].schedule[index][field] = value.trim();
      localStorage.setItem('75SoftUIEditable', JSON.stringify(db));
    }

    function addScheduleRow() {
      if (!db[activeDay]) {
        db[activeDay] = { workout: false, eatwell: false, reading: false, water: 0, schedule: JSON.parse(JSON.stringify(defaultSchedule)) };
      }
      if (!db[activeDay].schedule) {
        db[activeDay].schedule = JSON.parse(JSON.stringify(defaultSchedule));
      }

      db[activeDay].schedule.push({ time: '12:00 PM', activity: 'New Activity', meal: '' });
      localStorage.setItem('75SoftUIEditable', JSON.stringify(db));
      renderTableRows(db[activeDay].schedule);
    }

    function deleteScheduleRow(index) {
      if (db[activeDay] && db[activeDay].schedule) {
        db[activeDay].schedule.splice(index, 1);
        localStorage.setItem('75SoftUIEditable', JSON.stringify(db));
        renderTableRows(db[activeDay].schedule);
      }
    }

    function updateData() {
      const workout = document.getElementById('chk-workout').checked;
      const eatwell = document.getElementById('chk-eatwell').checked;
      const reading = document.getElementById('chk-reading').checked;
      const water = parseInt(document.getElementById('water-display').innerText);
      const schedule = db[activeDay]?.schedule || JSON.parse(JSON.stringify(defaultSchedule));

      db[activeDay] = { workout, eatwell, reading, water, schedule };
      localStorage.setItem('75SoftUIEditable', JSON.stringify(db));

      renderGrid();
      calcMetrics();
    }

    function adjustDay(step) {
      updateData();
      const next = activeDay + step;
      if (next >= 1 && next <= 75) {
        loadDayData(next);
      }
    }

    function addWater() {
      let cur = parseInt(document.getElementById('water-display').innerText);
      cur = (cur >= 3) ? 0 : cur + 1;
      document.getElementById('water-display').innerText = cur;
      updateData();
    }

    function calcMetrics() {
      let completedDays = 0;
      let streak = 0;
      let tempStreak = 0;

      for (let i = 1; i <= 75; i++) {
        const info = db[i];
        const isDone = info && info.workout && info.eatwell && info.reading && info.water >= 3;

        if (isDone) {
          completedDays++;
          tempStreak++;
          if (tempStreak > streak) streak = tempStreak;
        } else {
          tempStreak = 0;
        }
      }

      const progress = ((completedDays / 75) * 100).toFixed(1);
      document.getElementById('val-progress').innerText = `${progress}%`;
      document.getElementById('val-streak').innerText = `${streak} Day${streak === 1 ? '' : 's'}`;
    }
  </script>
</body>
</html>
