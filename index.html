<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>75 Soft Tracker</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #22c55e;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 8px 18px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 4px rgba(59, 130, 246, 0.25);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Day Selector Header */
    .day-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .day-selector h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .nav-arrow-btn {
      padding: 6px 14px;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .nav-arrow-btn:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .nav-arrow-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Card Containers */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Simple Habit Checkboxes */
    .habit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .habit-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .habit-item label {
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    /* Water Tracker Widget */
    .water-box {
      margin-top: 15px;
      padding: 12px;
      background: #eff6ff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .water-box span {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e40af;
    }

    .water-btn-group {
      display: flex;
      gap: 6px;
    }

    .water-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Time-Block Schedule */
    .schedule-form {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .schedule-form input[type="time"] {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .schedule-form input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .schedule-form button {
      padding: 8px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .schedule-list {
      list-style: none;
    }

    .schedule-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .schedule-list li.done span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      color: #ef4444;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* Meal Section Inputs */
    .meal-input-group {
      margin-bottom: 12px;
    }

    .meal-input-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .meal-input-group input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* Progress Tab Styling */
    .overall-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .progress-bar-bg {
      background-color: #f1f5f9;
      border-radius: 12px;
      height: 20px;
      width: 100%;
      overflow: hidden;
      margin: 16px 0 10px 0;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      background-color: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .grid-day {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 0;
      text-align: center;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .grid-day.completed {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
      font-weight: bold;
    }

    .grid-day.active-day {
      border: 2px solid var(--primary);
    }
  </style>
</head>
<body>

  <header>
    <h1>75 Soft Challenge</h1>
    <p>Daily Planner, Meal Logger & Progress Tracker</p>
  </header>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('daily')">Daily Dashboard</button>
    <button class="tab-btn" onclick="switchTab('progress')">Overall Progress</button>
  </div>

  <!-- TAB 1: DAILY DASHBOARD -->
  <div id="daily-tab" class="tab-content active">
    
    <!-- Day Navigation -->
    <div class="day-selector">
      <button class="nav-arrow-btn" id="prev-btn" onclick="navigateDay(-1)">&larr; Prev</button>
      <h2 id="day-title">Day 1 of 75</h2>
      <button class="nav-arrow-btn" id="next-btn" onclick="navigateDay(1)">Next &rarr;</button>
    </div>

    <div class="card-grid">
      
      <!-- Core Habits Checklist -->
      <div class="card">
        <h3>Core Tasks</h3>
        <div class="habit-item" onclick="toggleHabit('workout')">
          <input type="checkbox" id="habit-workout" onclick="event.stopPropagation(); saveData();">
          <label for="habit-workout">45-Minute Workout Completed</label>
        </div>
        <div class="habit-item" onclick="toggleHabit('reading')">
          <input type="checkbox" id="habit-reading" onclick="event.stopPropagation(); saveData();">
          <label for="habit-reading">Read 10 Pages Completed</label>
        </div>

        <!-- Water Counter -->
        <div class="water-box">
          <span>Water: <span id="water-num">0.0</span> / 3.0 L</span>
          <div class="water-btn-group">
            <button class="water-btn" onclick="addWater(-0.5)">-0.5L</button>
            <button class="water-btn" onclick="addWater(0.5)">+0.5L</button>
          </div>
        </div>
      </div>

      <!-- Meal Tracker Card -->
      <div class="card">
        <h3>Meal Log</h3>
        <div class="meal-input-group">
          <label for="meal-breakfast">Breakfast</label>
          <input type="text" id="meal-breakfast" placeholder="e.g., Oatmeal & protein shake" oninput="saveData()">
        </div>
        <div class="meal-input-group">
          <label for="meal-lunch">Lunch</label>
          <input type="text" id="meal-lunch" placeholder="e.g., Chicken bowl" oninput="saveData()">
        </div>
        <div class="meal-input-group">
          <label for="meal-dinner">Dinner</label>
          <input type="text" id="meal-dinner" placeholder="e.g., Salmon & roasted veggies" oninput="saveData()">
        </div>
        <div class="meal-input-group">
          <label for="meal-snacks">Snacks</label>
          <input type="text" id="meal-snacks" placeholder="e.g., Apple, almonds" oninput="saveData()">
        </div>
      </div>

      <!-- Timeblock Daily Schedule -->
      <div class="card" style="grid-column: 1 / -1;">
        <h3>Daily Schedule</h3>
        <div class="schedule-form">
          <input type="time" id="time-input">
          <input type="text" id="task-input" placeholder="Add activity or task...">
          <button onclick="addScheduleTask()">Add</button>
        </div>
        <ul id="schedule-items" class="schedule-list">
          <!-- Dynamically populated -->
        </ul>
      </div>

    </div>
  </div>

  <!-- TAB 2: OVERALL PROGRESS -->
  <div id="progress-tab" class="tab-content">
    <div class="overall-card">
      <h2 style="font-size: 1.3rem; font-weight: 700;">Challenge Completion</h2>
      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
      <p style="color: var(--text-muted); font-size: 0.95rem;">
        <strong id="completed-count" style="color: var(--text-main);">0</strong> of 75 Days Finished 
        (<span id="percent-text">0%</span>)
      </p>
    </div>

    <div class="card">
      <h3>75-Day Master Grid</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">Tap any day square to navigate to its daily planner.</p>
      <div id="master-grid" class="grid-container">
        <!-- Generated via JS -->
      </div>
    </div>
  </div>

  <script>
    let currentDay = 1;
    let store = JSON.parse(localStorage.getItem('75SoftApp')) || {};

    document.addEventListener('DOMContentLoaded', () => {
      renderDay(currentDay);
      buildMasterGrid();
      calcProgress();
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'daily') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('daily-tab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('progress-tab').classList.add('active');
        buildMasterGrid();
        calcProgress();
      }
    }

    function renderDay(day) {
      currentDay = day;
      document.getElementById('day-title').innerText = `Day ${currentDay} of 75`;
      document.getElementById('prev-btn').disabled = (currentDay === 1);
      document.getElementById('next-btn').disabled = (currentDay === 75);

      const data = store[currentDay] || {
        workout: false,
        reading: false,
        water: 0.0,
        meals: { breakfast: '', lunch: '', dinner: '', snacks: '' },
        schedule: []
      };

      document.getElementById('habit-workout').checked = !!data.workout;
      document.getElementById('habit-reading').checked = !!data.reading;
      document.getElementById('water-num').innerText = (data.water || 0.0).toFixed(1);

      document.getElementById('meal-breakfast').value = data.meals?.breakfast || '';
      document.getElementById('meal-lunch').value = data.meals?.lunch || '';
      document.getElementById('meal-dinner').value = data.meals?.dinner || '';
      document.getElementById('meal-snacks').value = data.meals?.snacks || '';

      renderScheduleList(data.schedule || []);
    }

    function saveData() {
      const workout = document.getElementById('habit-workout').checked;
      const reading = document.getElementById('habit-reading').checked;
      const water = parseFloat(document.getElementById('water-num').innerText);

      const breakfast = document.getElementById('meal-breakfast').value;
      const lunch = document.getElementById('meal-lunch').value;
      const dinner = document.getElementById('meal-dinner').value;
      const snacks = document.getElementById('meal-snacks').value;

      const currentSchedule = store[currentDay]?.schedule || [];

      store[currentDay] = {
        workout,
        reading,
        water,
        meals: { breakfast, lunch, dinner, snacks },
        schedule: currentSchedule,
        completed: (workout && reading && water >= 3.0)
      };

      localStorage.setItem('75SoftApp', JSON.stringify(store));
    }

    function toggleHabit(type) {
      const el = document.getElementById(`habit-${type}`);
      el.checked = !el.checked;
      saveData();
    }

    function navigateDay(delta) {
      saveData();
      const target = currentDay + delta;
      if (target >= 1 && target <= 75) {
        renderDay(target);
      }
    }

    function addWater(val) {
      let cur = parseFloat(document.getElementById('water-num').innerText);
      let updated = Math.min(Math.max(0, cur + val), 5.0);
      document.getElementById('water-num').innerText = updated.toFixed(1);
      saveData();
    }

    function addScheduleTask() {
      const time = document.getElementById('time-input').value;
      const task = document.getElementById('task-input').value.trim();
      if (!task) return;

      if (!store[currentDay]) store[currentDay] = {};
      if (!store[currentDay].schedule) store[currentDay].schedule = [];

      store[currentDay].schedule.push({
        id: Date.now(),
        time: time || 'Flex',
        task,
        done: false
      });

      document.getElementById('time-input').value = '';
      document.getElementById('task-input').value = '';

      saveData();
      renderScheduleList(store[currentDay].schedule);
    }

    function toggleScheduleTask(id) {
      const list = store[currentDay].schedule;
      const item = list.find(i => i.id === id);
      if (item) {
        item.done = !item.done;
        saveData();
        renderScheduleList(list);
      }
    }

    function deleteScheduleTask(id) {
      store[currentDay].schedule = store[currentDay].schedule.filter(i => i.id !== id);
      saveData();
      renderScheduleList(store[currentDay].schedule);
    }

    function renderScheduleList(items) {
      const ul = document.getElementById('schedule-items');
      ul.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        if (item.done) li.classList.add('done');
        li.innerHTML = `
          <div>
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleScheduleTask(${item.id})">
            <span style="margin-left: 8px;"><strong>${item.time}:</strong> ${item.task}</span>
          </div>
          <button class="delete-btn" onclick="deleteScheduleTask(${item.id})">&times;</button>
        `;
        ul.appendChild(li);
      });
    }

    function buildMasterGrid() {
      const grid = document.getElementById('master-grid');
      grid.innerHTML = '';

      for (let day = 1; day <= 75; day++) {
        const isDone = store[day]?.completed;
        const square = document.createElement('div');
        square.className = `grid-day ${isDone ? 'completed' : ''} ${day === currentDay ? 'active-day' : ''}`;
        square.innerText = `Day ${day}`;
        square.onclick = () => {
          switchTab('daily');
          renderDay(day);
        };
        grid.appendChild(square);
      }
    }

    function calcProgress() {
      let doneCount = 0;
      for (let day = 1; day <= 75; day++) {
        if (store[day]?.completed) doneCount++;
      }
      const pct = Math.round((doneCount / 75) * 100);
      document.getElementById('completed-count').innerText = doneCount;
      document.getElementById('percent-text').innerText = `${pct}%`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }
  </script>
</body>
</html>
