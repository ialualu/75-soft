<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>75 Soft Challenge Tracker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --accent: #16a34a;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header & Navigation */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .header p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .tab-pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .pill-btn {
      padding: 8px 18px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
    }

    /* Day Banner */
    .day-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .day-banner h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .banner-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .banner-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Checkbox Rows */
    .habit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .habit-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .habit-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .habit-row label {
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    /* Water Bar */
    .water-card {
      background: var(--primary-light);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }

    .water-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e40af;
    }

    .water-btns {
      display: flex;
      gap: 6px;
    }

    .water-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Schedule Section */
    .schedule-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .schedule-bar input[type="time"] {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .schedule-bar input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .schedule-bar button {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--muted);
    }

    .remove-btn {
      color: #ef4444;
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Meal Section */
    .meal-field {
      margin-bottom: 12px;
    }

    .meal-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .meal-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* Overall Tab Elements */
    .progress-box {
      text-align: center;
      padding: 10px 0;
    }

    .progress-track {
      background: var(--bg);
      border: 1px solid var(--border);
      height: 16px;
      border-radius: 9999px;
      overflow: hidden;
      margin: 16px 0;
    }

    .progress-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    .grid-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .grid-cell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 0;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .grid-cell.done {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }

    .grid-cell.current {
      border: 2px solid var(--primary);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>75 Soft Challenge</h1>
    <p>Plan your day, track meals, and monitor progress</p>
  </div>

  <div class="tab-pills">
    <button class="pill-btn active" onclick="showTab('planner')">Daily Planner</button>
    <button class="pill-btn" onclick="showTab('progress')">Overall Progress</button>
  </div>

  <!-- TAB 1: DAILY PLANNER -->
  <div id="planner" class="tab-pane active">
    
    <div class="day-banner">
      <button class="banner-btn" id="btn-prev" onclick="shiftDay(-1)">&larr; Previous</button>
      <h2 id="day-heading">Day 1 of 75</h2>
      <button class="banner-btn" id="btn-next" onclick="shiftDay(1)">Next &rarr;</button>
    </div>

    <!-- Core Habits Card -->
    <div class="card">
      <div class="card-title">Daily Goals</div>
      <div class="habit-row" onclick="toggleCheck('workout')">
        <div class="habit-left">
          <input type="checkbox" id="chk-workout" onclick="event.stopPropagation(); saveState();">
          <label for="chk-workout">45-Minute Workout</label>
        </div>
      </div>
      <div class="habit-row" onclick="toggleCheck('reading')">
        <div class="habit-left">
          <input type="checkbox" id="chk-reading" onclick="event.stopPropagation(); saveState();">
          <label for="chk-reading">Read 10 Pages</label>
        </div>
      </div>

      <div class="water-card">
        <div class="water-label">Water: <span id="val-water">0.0</span> / 3.0 L</div>
        <div class="water-btns">
          <button class="water-btn" onclick="updateWater(-0.5)">-0.5L</button>
          <button class="water-btn" onclick="updateWater(0.5)">+0.5L</button>
        </div>
      </div>
    </div>

    <!-- Schedule Card -->
    <div class="card">
      <div class="card-title">Timeblock Schedule</div>
      <div class="schedule-bar">
        <input type="time" id="input-time">
        <input type="text" id="input-task" placeholder="Add task or activity...">
        <button onclick="addTask()">Add</button>
      </div>
      <ul id="task-container" class="task-list"></ul>
    </div>

    <!-- Meals Card -->
    <div class="card">
      <div class="card-title">Meal Log</div>
      <div class="meal-field">
        <label>Breakfast</label>
        <input type="text" id="meal-b" placeholder="Log breakfast..." oninput="saveState()">
      </div>
      <div class="meal-field">
        <label>Lunch</label>
        <input type="text" id="meal-l" placeholder="Log lunch..." oninput="saveState()">
      </div>
      <div class="meal-field">
        <label>Dinner</label>
        <input type="text" id="meal-d" placeholder="Log dinner..." oninput="saveState()">
      </div>
      <div class="meal-field">
        <label>Snacks</label>
        <input type="text" id="meal-s" placeholder="Log snacks..." oninput="saveState()">
      </div>
    </div>

  </div>

  <!-- TAB 2: OVERALL PROGRESS -->
  <div id="progress" class="tab-pane">
    <div class="card progress-box">
      <div class="card-title">75-Day Master Progress</div>
      <div class="progress-track">
        <div id="bar-fill" class="progress-fill"></div>
      </div>
      <p><strong id="lbl-count">0</strong> of 75 Days Completed (<span id="lbl-percent">0%</span>)</p>
    </div>

    <div class="card">
      <div class="card-title">All Days Overview</div>
      <div id="grid-container" class="grid-wrap"></div>
    </div>
  </div>

  <script>
    let activeDay = 1;
    let appState = JSON.parse(localStorage.getItem('75SoftDataV2')) || {};

    document.addEventListener('DOMContentLoaded', () => {
      loadDayData(activeDay);
      drawGrid();
      drawProgress();
    });

    function showTab(tabId) {
      document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

      if (tabId === 'planner') {
        document.querySelectorAll('.pill-btn')[0].classList.add('active');
        document.getElementById('planner').classList.add('active');
      } else {
        document.querySelectorAll('.pill-btn')[1].classList.add('active');
        document.getElementById('progress').classList.add('active');
        drawGrid();
        drawProgress();
      }
    }

    function loadDayData(day) {
      activeDay = day;
      document.getElementById('day-heading').innerText = `Day ${activeDay} of 75`;
      document.getElementById('btn-prev').disabled = (activeDay === 1);
      document.getElementById('btn-next').disabled = (activeDay === 75);

      const data = appState[activeDay] || {
        workout: false,
        reading: false,
        water: 0.0,
        meals: { b: '', l: '', d: '', s: '' },
        schedule: []
      };

      document.getElementById('chk-workout').checked = !!data.workout;
      document.getElementById('chk-reading').checked = !!data.reading;
      document.getElementById('val-water').innerText = (data.water || 0.0).toFixed(1);

      document.getElementById('meal-b').value = data.meals?.b || '';
      document.getElementById('meal-l').value = data.meals?.l || '';
      document.getElementById('meal-d').value = data.meals?.d || '';
      document.getElementById('meal-s').value = data.meals?.s || '';

      renderTasks(data.schedule || []);
    }

    function saveState() {
      const workout = document.getElementById('chk-workout').checked;
      const reading = document.getElementById('chk-reading').checked;
      const water = parseFloat(document.getElementById('val-water').innerText);

      const b = document.getElementById('meal-b').value;
      const l = document.getElementById('meal-l').value;
      const d = document.getElementById('meal-d').value;
      const s = document.getElementById('meal-s').value;

      const schedule = appState[activeDay]?.schedule || [];

      appState[activeDay] = {
        workout,
        reading,
        water,
        meals: { b, l, d, s },
        schedule,
        done: (workout && reading && water >= 3.0)
      };

      localStorage.setItem('75SoftDataV2', JSON.stringify(appState));
    }

    function toggleCheck(id) {
      const el = document.getElementById(`chk-${id}`);
      el.checked = !el.checked;
      saveState();
    }

    function shiftDay(step) {
      saveState();
      const next = activeDay + step;
      if (next >= 1 && next <= 75) {
        loadDayData(next);
      }
    }

    function updateWater(amt) {
      let current = parseFloat(document.getElementById('val-water').innerText);
      let nextVal = Math.min(Math.max(0, current + amt), 5.0);
      document.getElementById('val-water').innerText = nextVal.toFixed(1);
      saveState();
    }

    function addTask() {
      const time = document.getElementById('input-time').value;
      const task = document.getElementById('input-task').value.trim();
      if (!task) return;

      if (!appState[activeDay]) appState[activeDay] = {};
      if (!appState[activeDay].schedule) appState[activeDay].schedule = [];

      appState[activeDay].schedule.push({
        id: Date.now(),
        time: time || 'Flex',
        task,
        done: false
      });

      document.getElementById('input-time').value = '';
      document.getElementById('input-task').value = '';

      saveState();
      renderTasks(appState[activeDay].schedule);
    }

    function toggleTask(id) {
      const list = appState[activeDay].schedule;
      const item = list.find(t => t.id === id);
      if (item) {
        item.done = !item.done;
        saveState();
        renderTasks(list);
      }
    }

    function removeTask(id) {
      appState[activeDay].schedule = appState[activeDay].schedule.filter(t => t.id !== id);
      saveState();
      renderTasks(appState[activeDay].schedule);
    }

    function renderTasks(list) {
      const ul = document.getElementById('task-container');
      ul.innerHTML = '';
      list.forEach(item => {
        const li = document.createElement('li');
        li.className = `task-item ${item.done ? 'completed' : ''}`;
        li.innerHTML = `
          <div>
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTask(${item.id})">
            <span style="margin-left: 8px;"><strong>${item.time}:</strong> ${item.task}</span>
          </div>
          <button class="remove-btn" onclick="removeTask(${item.id})">&times;</button>
        `;
        ul.appendChild(li);
      });
    }

    function drawGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      for (let day = 1; day <= 75; day++) {
        const isDone = appState[day]?.done;
        const div = document.createElement('div');
        div.className = `grid-cell ${isDone ? 'done' : ''} ${day === activeDay ? 'current' : ''}`;
        div.innerText = `Day ${day}`;
        div.onclick = () => {
          showTab('planner');
          loadDayData(day);
        };
        container.appendChild(div);
      }
    }

    function drawProgress() {
      let completed = 0;
      for (let day = 1; day <= 75; day++) {
        if (appState[day]?.done) completed++;
      }
      const pct = Math.round((completed / 75) * 100);
      document.getElementById('lbl-count').innerText = completed;
      document.getElementById('lbl-percent').innerText = `${pct}%`;
      document.getElementById('bar-fill').style.width = `${pct}%`;
    }
  </script>
</body>
</html>
